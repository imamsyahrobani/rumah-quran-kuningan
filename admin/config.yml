backend:
  name: git-gateway
  branch: main

# Lokasi tempat foto yang diupload lewat admin akan disimpan
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Artikel Blog"
    label_singular: "Artikel"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    editor:
      preview: false
    fields:
      - { label: "Judul Artikel", name: "title", widget: "string" }
      - {
          label: "Slug (alamat URL artikel)",
          name: "slug",
          widget: "string",
          hint: "Huruf kecil semua, pakai tanda - sebagai pemisah, tanpa spasi. Contoh: tips-menghafal-quran",
        }
      - {
          label: "Tanggal Terbit",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          label: "Kategori",
          name: "category",
          widget: "select",
          options: ["Edukasi", "Tips Parenting", "Kegiatan", "Pengumuman"],
        }
      - {
          label: "Ringkasan Singkat",
          name: "excerpt",
          widget: "text",
          hint: "1-2 kalimat yang tampil di daftar artikel.",
        }
      - {
          label: "Gambar Sampul (opsional)",
          name: "image",
          widget: "image",
          required: false,
          hint: "Foto utama yang tampil di daftar artikel dan di atas isi artikel.",
        }
      - {
          label: "Isi Artikel",
          name: "content",
          widget: "markdown",
          hint: "Tulis seperti di Word. Pakai tombol di atas kotak untuk teks tebal, miring, judul bagian, daftar, dan tombol gambar untuk menyisipkan foto di tengah artikel.",
          buttons: ["bold", "italic", "heading-two", "heading-three", "link", "bulleted-list", "numbered-list", "quote"],
          editor_components: ["image"],
        }

  - name: "events"
    label: "Halaman Event"
    label_singular: "Event"
    folder: "content/events"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    editor:
      preview: false
    fields:
      - {
          label: "Tampilkan halaman ini?",
          name: "published",
          widget: "boolean",
          default: true,
          hint: "Matikan kalau masih draf atau ingin menyembunyikan event ini dari situs.",
        }
      - { label: "Nama Event", name: "title", widget: "string" }
      - {
          label: "Slug (alamat halaman)",
          name: "slug",
          widget: "string",
          hint: "Huruf kecil, pakai tanda -, tanpa spasi. Contoh: kajian-ramadhan. Alamat jadinya namasitus.com/event/kajian-ramadhan",
        }
      - {
          label: "Kalimat Penjelas Singkat",
          name: "tagline",
          widget: "string",
          required: false,
          hint: "Satu kalimat di bawah judul. Juga dipakai sebagai teks pratinjau saat link dibagikan di WhatsApp.",
        }
      - {
          label: "Tanggal Acara",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          hint: "Setelah tanggal ini lewat, halaman otomatis menampilkan 'Acara sudah berlangsung' dan tombol daftar disembunyikan.",
        }
      - { label: "Waktu", name: "time", widget: "string", required: false, hint: "Contoh: 08.00 - 12.00 WIB" }
      - { label: "Lokasi", name: "location", widget: "string", required: false }
      - { label: "Link Peta (opsional)", name: "maps_url", widget: "string", required: false, hint: "Tempel link Google Maps." }
      - { label: "Biaya / Infaq", name: "fee", widget: "string", required: false, hint: "Contoh: Gratis, atau Rp50.000" }
      - { label: "Poster / Banner", name: "image", widget: "image", required: false }
      - {
          label: "Isi Halaman",
          name: "body",
          widget: "markdown",
          hint: "Jelaskan acaranya: tujuan, pembicara, rangkaian acara, syarat peserta, dan sebagainya. Boleh menyisipkan gambar.",
          buttons: ["bold", "italic", "heading-two", "heading-three", "link", "bulleted-list", "numbered-list", "quote"],
          editor_components: ["image"],
        }
      - {
          label: "Tulisan di Tombol",
          name: "cta_label",
          widget: "string",
          default: "Daftar Sekarang",
          required: false,
        }
      - {
          label: "Link Pendaftaran Lain (opsional)",
          name: "register_url",
          widget: "string",
          required: false,
          hint: "Kosongkan kalau pendaftaran lewat WhatsApp admin. Isi dengan link Google Form dan sejenisnya kalau ada.",
        }
      - {
          label: "Pesan Otomatis WhatsApp (opsional)",
          name: "wa_message",
          widget: "string",
          required: false,
          hint: "Teks yang terisi otomatis saat peserta menekan tombol daftar. Kosongkan untuk memakai teks standar.",
        }
