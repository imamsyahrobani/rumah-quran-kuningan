backend:
  name: git-gateway
  branch: main

# Lokasi tempat foto yang diupload lewat admin akan disimpan
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ------------------------------------------------------------
  #  ARTIKEL BLOG
  # ------------------------------------------------------------
  - name: "posts"
    label: "Artikel Blog"
    label_singular: "Artikel"
    folder: "content/posts"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{date}}"
    editor:
      preview: false
    fields:
      - { label: "Judul Artikel", name: "title", widget: "string" }
      - {
          label: "Slug (alamat URL artikel)",
          name: "slug",
          widget: "string",
          hint: "Huruf kecil semua, pakai tanda - sebagai pemisah, tanpa spasi. Contoh: tips-menghafal-quran",
        }
      - {
          label: "Tanggal Terbit",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          label: "Kategori",
          name: "category",
          widget: "select",
          options: ["Edukasi", "Tips Parenting", "Kegiatan", "Pengumuman"],
        }
      - {
          label: "Ringkasan Singkat",
          name: "excerpt",
          widget: "text",
          hint: "1-2 kalimat yang tampil di daftar artikel.",
        }
      - {
          label: "Gambar Sampul (opsional)",
          name: "image",
          widget: "image",
          required: false,
          hint: "Foto utama yang tampil di daftar artikel dan di atas isi artikel.",
        }
      - {
          label: "Isi Artikel",
          name: "content",
          widget: "markdown",
          hint: "Tulis seperti di Word. Pakai tombol di atas kotak untuk teks tebal, miring, judul bagian, daftar, dan tombol gambar untuk menyisipkan foto di tengah artikel.",
          buttons: ["bold", "italic", "heading-two", "heading-three", "link", "bulleted-list", "numbered-list", "quote"],
          editor_components: ["image"],
        }

  # ------------------------------------------------------------
  #  HALAMAN (KODE HTML SENDIRI)
  # ------------------------------------------------------------
  - name: "pages"
    label: "Halaman (Kode HTML)"
    label_singular: "Halaman"
    folder: "content/pages"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — /{{slug}}/"
    editor:
      preview: false
    fields:
      - {
          label: "Tayangkan halaman ini?",
          name: "published",
          widget: "boolean",
          default: true,
          hint: "Matikan kalau masih draf atau ingin menyembunyikan halaman dari situs.",
        }
      - { label: "Judul Halaman", name: "title", widget: "string", hint: "Tampil di tab browser dan di judul saat link dibagikan." }
      - {
          label: "Slug (alamat halaman)",
          name: "slug",
          widget: "string",
          hint: "Huruf kecil, pakai tanda -, tanpa spasi. Contoh: kajian-ramadhan. Alamatnya jadi namasitus.com/kajian-ramadhan/ . Jangan pakai: admin, assets, content, blog, index.",
        }
      - {
          label: "Deskripsi Singkat (opsional)",
          name: "description",
          widget: "string",
          required: false,
          hint: "Satu kalimat untuk pratinjau saat link dibagikan di WhatsApp atau mesin pencari.",
        }
      - {
          label: "Kode HTML",
          name: "html",
          widget: "code",
          default_language: "html",
          allow_language_selection: false,
          output_code_only: true,
          hint: "Tempel atau tulis kode HTML di sini. (1) Kalau Bapak hanya menulis isi halaman saja, tanpa <html> dan <body>, situs otomatis menambahkan header dan footer Rumah Qur'an. (2) Kalau Bapak menulis kode LENGKAP yang diawali <!DOCTYPE html>, halaman dipakai apa adanya tanpa tambahan apa pun. CSS boleh ditulis di dalam <style>. Warna situs bisa dipakai lewat var(--ink), var(--gold), var(--maroon), var(--parchment).",
        }
      - {
          label: "Unggah Gambar untuk Halaman Ini (opsional)",
          name: "images",
          widget: "list",
          required: false,
          hint: "Unggah foto di sini, lalu panggil di kode HTML dengan alamat /assets/uploads/NAMA-FILE.jpg . Pakai nama file huruf kecil tanpa spasi (contoh: poster-ramadhan.jpg).",
          field: { label: "Gambar", name: "image", widget: "image" },
        }
